title: "QuickFlex\nConnect"
tooltip: "QuickFlexConnect: выберите два элемента (воздуховод, арматура, соединительная деталь, оборудование, воздухораспределитель) — между их ближайшими свободными коннекторами строится гибкий воздуховод выбранного типа (тип и размер — после выбора элементов; если размеры разные — плашки с обоими размерами). Shift+клик — настройки: тип из списка или клик по гибкому воздуховоду в модели, параметр «Гибкая конфигурация» (значения из списка, по умолчанию «Гибкий») и режим «Цикл» (по умолчанию выключен)."
author: HVAC-Duct-Design
