title: "Гнучкий\nміж конекторами"
tooltip: "Оберіть два вільні конектори (клік на елементі біля конектора) — між ними будується гнучкий повітровод, кінці з'єднуються з конекторами. Тип — з налаштувань (Shift+клік по кнопці), за замовчуванням «Гибкий». Один повітровод за запуск; серія до Esc вмикається кнопкою «Цикл»."
author: HVAC-Duct-Design
