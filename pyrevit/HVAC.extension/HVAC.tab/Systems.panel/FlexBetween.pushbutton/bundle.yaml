title: "Гнучкий\nміж конекторами"
tooltip: "Оберіть два елементи (повітровод, арматура, фасонна частина, обладнання) — між їхніми найближчими вільними конекторами будується гнучкий повітровод обраного типу (тип обирається після натискання). Shift+клік — налаштування: параметр «Гибкая конфигурация» (за замовчуванням «Гибкий») і режим «Цикл» (за замовчуванням вимкнено)."
author: HVAC-Duct-Design
