title: "Гнучкий\nміж конекторами"
tooltip: "Оберіть два елементи (повітровод, арматура, фасонна частина, обладнання) — між їхніми найближчими вільними конекторами будується гнучкий повітровод. Shift+клік — вікно налаштувань: тип (за замовчуванням «Гибкий») і режим «Цикл» (за замовчуванням вимкнено)."
author: HVAC-Duct-Design
