title: "Гнучкий\nміж конекторами"
tooltip: "Оберіть два вільні конектори (клік на елементі біля конектора) — між ними будується гнучкий повітровод, кінці з'єднуються з конекторами. Shift+клік — вікно налаштувань: тип (за замовчуванням «Гибкий») і режим «Цикл» (за замовчуванням вимкнено)."
author: HVAC-Duct-Design
