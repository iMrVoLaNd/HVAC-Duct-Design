title: "Flex\nTail"
tooltip: "FlexTail: кликните по оборудованию, арматуре, соединительной детали или воздухораспределителю, к ближайшему коннектору которого подключён жёсткий воздуховод. В окне задайте длину (по умолчанию 500 мм, последнее значение запоминается; есть быстрые значения 300–2500 мм) и тип гибкого воздуховода — жёсткий участок заданной длины от элемента заменится гибким. Если участок короче заданной длины, он преобразуется целиком, и кнопка сообщит его длину. «Гибкая конфигурация» берётся из настроек QuickFlexConnect (Shift+клик по его кнопке)."
author: HVAC-Duct-Design
