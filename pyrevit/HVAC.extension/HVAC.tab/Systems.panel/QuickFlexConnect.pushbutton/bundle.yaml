title: "QuickFlex\nConnect"
tooltip: "QuickFlexConnect: оберіть два елементи (повітровод, арматура, фасонна частина, обладнання, повітророзподільник) — між їхніми найближчими вільними конекторами будується гнучкий повітровод обраного типу (тип і розмір — після вибору елементів; якщо розміри різні — чипи з обома розмірами). Shift+клік — налаштування: тип зі списку або клік на гнучкий повітровод у моделі, параметр «Гибкая конфигурация» (варіанти зі списку, за замовчуванням «Гибкий») і режим «Цикл» (за замовчуванням вимкнено)."
author: HVAC-Duct-Design
