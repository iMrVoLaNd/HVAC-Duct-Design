<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Палітра систем вентиляції</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="ribbon">
  <div class="ribbon__inner">
    <div class="ribbon__group" role="group" data-i18n-attr="aria-label:ariaShow">
      <span class="ribbon__label" data-i18n="ribbonShow"></span>
      <div class="seg" id="filter">
        <button type="button" data-filter="all" class="is-active" data-i18n="showAll"></button>
        <button type="button" data-filter="supply" data-i18n="showSupply"></button>
        <button type="button" data-filter="exhaust" data-i18n="showExhaust"></button>
      </div>
    </div>
    <div class="ribbon__group" role="group" data-i18n-attr="aria-label:ariaView">
      <span class="ribbon__label" data-i18n="ribbonView"></span>
      <div class="seg" id="view">
        <button type="button" data-view="iso" class="is-active" data-i18n="viewIso"></button>
        <button type="button" data-view="plan" data-i18n="viewPlan"></button>
      </div>
    </div>
    <div class="ribbon__group" role="group" data-i18n-attr="aria-label:ariaWalls">
      <span class="ribbon__label" data-i18n="ribbonWalls"></span>
      <div class="seg" id="walls"></div>
      <button type="button" class="btn" id="iso-walls" aria-pressed="false" data-i18n="wallsIso" data-i18n-attr="title:wallsIsoTitle"></button>
    </div>
    <div class="ribbon__group" role="group" data-i18n-attr="aria-label:ariaExport">
      <span class="ribbon__label" data-i18n="ribbonExport"></span>
      <button type="button" class="btn" id="dl-csv">CSV</button>
      <button type="button" class="btn" id="dl-json">JSON</button>
    </div>
    <div class="ribbon__group" role="group" data-i18n-attr="aria-label:ariaLang">
      <span class="ribbon__label" data-i18n="ribbonLang"></span>
      <div class="seg" id="lang">
        <button type="button" data-lang="uk">УКР</button>
        <button type="button" data-lang="ru">РУС</button>
      </div>
    </div>
  </div>
</header>

<main class="sheet">
  <h1 class="sheet__title" data-i18n="sheetTitle"></h1>
  <p class="sheet__subtitle" data-i18n="sheetSubtitle"></p>

  <section class="note">
    <p data-i18n-html="noteRead"></p>
    <p data-i18n-html="noteSource"></p>
  </section>

  <section class="check" id="check" data-i18n-attr="aria-label:ariaCheck"></section>

  <div id="groups"></div>

  <section class="floor">
    <h2 class="group__title" data-i18n="floorTitle"></h2>
    <p class="floor__hint" data-i18n="floorHint"></p>
    <div class="floor__controls">
      <label><span data-i18n="floorCount"></span> <output id="floor-n">8</output>
        <input type="range" id="floor-range" min="2" max="12" value="8">
      </label>
      <div class="seg" id="floor-kind">
        <button type="button" data-kind="supply" data-i18n="floorSupply"></button>
        <button type="button" data-kind="exhaust" data-i18n="floorExhaust"></button>
        <button type="button" data-kind="both" class="is-active" data-i18n="floorBoth"></button>
      </div>
    </div>
    <div class="floor__plan" id="floor-plan"></div>
  </section>

  <footer class="titleblock">
    <div><span data-i18n="tbProject"></span><b data-i18n="tbProjectVal"></b></div>
    <div><span data-i18n="tbSupply"></span><b>П1–П12</b></div>
    <div><span data-i18n="tbExhaust"></span><b>В1–В12</b></div>
    <div><span data-i18n="tbNext"></span><b data-i18n="tbNextVal"></b></div>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="js/palette.js"></script>
<script src="js/app.js"></script>
</body>
</html>
